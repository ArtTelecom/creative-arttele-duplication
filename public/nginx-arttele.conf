# ===================================================================
# Конфиг nginx для сайта АртТелеком (SPA на React + PHP для замера).
# РЕШАЕТ 404 на /dashboard, /login, /speedtest и любых других страницах.
#
# nginx НЕ читает .htaccess — правила берутся только отсюда.
#
# КАК ПОДКЛЮЧИТЬ (один раз):
#   1. Положите этот файл на сервер, например:
#        /etc/nginx/snippets/arttele.conf
#   2. В основном server{} блоке сайта (там где listen 443 ssl; server_name arttele.ru;)
#      замените содержимое на приведённое ниже ИЛИ подключите этот файл строкой:
#        include /etc/nginx/snippets/arttele.conf;
#   3. Проверьте и перезагрузите:
#        sudo nginx -t && sudo systemctl reload nginx
#
# ВАЖНО: поправьте два пути под свой сервер:
#   - root   -> папка с билдом сайта (где лежит index.html)
#   - fastcgi_pass -> сокет вашего PHP-FPM (см. ниже как узнать)
# ===================================================================

# --- Путь к файлам сайта (папка с index.html после сборки) ---
root /var/www/arttele/dist;
index index.html;

# --- PHP: upload.php (приём отдачи в тесте скорости) и mikrobill-api.php ---
# Узнать сокет: ls /run/php/  (например php8.1-fpm.sock) или "unix:/var/run/php-fpm.sock"
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.1-fpm.sock;   # <-- ПОДСТАВЬТЕ свой сокет PHP-FPM
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # крупное тело запроса для честного замера отдачи
    client_max_body_size 256M;
    fastcgi_read_timeout 120s;
}

# --- Файл для замера скорости: без кеша, отдаём как есть ---
location = /speedtest.bin {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Accept-Ranges bytes;
    types { }
    default_type application/octet-stream;
}

# --- PWA: manifest и service worker без агрессивного кеша ---
location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    default_type application/javascript;
}
location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
}
location = /manifest-lk.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
}

# --- Кеш статики (js/css/картинки/шрифты) ---
location ~* \.(js|css|png|jpe?g|webp|svg|woff2?|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# --- ГЛАВНОЕ ПРАВИЛО SPA: любой маршрут -> index.html ---
# Именно это убирает 404 на /dashboard?paid=... , /login , /speedtest и т.д.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";   # index.html всегда свежий
}
